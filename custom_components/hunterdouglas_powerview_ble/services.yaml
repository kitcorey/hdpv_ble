set_tdbu_position:
  target:
    entity:
      integration: hunterdouglas_powerview_ble
      domain: cover
  fields:
    top_position:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    bottom_position:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

group_move:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hunterdouglas_powerview_ble
          domain: cover
          multiple: true
    position:
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    connect_timeout:
      default: 10
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: s
